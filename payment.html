<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዘመን ዕጣ - የክፍያ ማረጋገጫ</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 40px;
        }
        .header {
            display: flex;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #f0b90b;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-left: 15px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #f0b90b;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #8b949e;
        }
        .row span {
            color: #ffffff;
        }
        .bank-option {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bank-info div:first-child {
            font-weight: bold;
            font-size: 14px;
        }
        .bank-info div:last-child {
            font-size: 13px;
            color: #f0b90b;
            margin-top: 3px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            font-size: 13px;
            color: #8b949e;
            display: block;
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            background-color: #f0b90b;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="grid.html" class="back-btn">← ተመለስ</a>
        <div class="title">የክፍያ ማረጋገጫ ገጽ</div>
    </div>

    <!-- Summary Card -->
    <div class="card">
        <div class="card-title">የግዢ ማጠቃለያ</div>
        <div class="row">ተመራጭ ቲኬቶች: <span id="summaryTickets">361, 1987</span></div>
        <div class="row">የቲኬት ብዛት: <span id="summaryCount">2 ቲኬት</span></div>
        <div class="row" style="border-top: 1px solid #30363d; padding-top: 8px; margin-top: 8px;">
            ጠቅላላ ዋጋ: <span id="summaryPrice" style="color: #f0b90b; font-size: 16px; font-weight: bold;">600 ETB</span>
        </div>
    </div>

    <!-- Banks List Card -->
    <div class="card">
        <div class="card-title">ገንዘብ የሚያስተላልፉባቸው አካውንቶች</div>
        
        <div class="bank-option">
            <div class="bank-info">
                <div>ኢትዮጵያ ንግድ ባንክ (CBE)</div>
                <div>1000334884407 (ብስራተገብርኤል አስፋው)</div>
            </div>
            <button onclick="copyToClipboard('1000334884407')" style="background:#30363d; color:#fff; border:none; padding:6px 10px; border-radius:5px; cursor:pointer; font-size:12px;">ቅዳ</button>
        </div>

        <div class="bank-option">
            <div class="bank-info">
                <div>ቴሌብር (Telebirr)</div>
                <div>0912345678 (ብስራተገብርኤል አስፋው)</div>
            </div>
            <button onclick="copyToClipboard('0912345678')" style="background:#30363d; color:#fff; border:none; padding:6px 10px; border-radius:5px; cursor:pointer; font-size:12px;">ቅዳ</button>
        </div>
    </div>

    <!-- Submission Form -->
    <div class="card">
        <div class="card-title">የክፍያ ማረጋገጫ መረጃ ይሙሉ</div>
        
        <div class="form-group">
            <label class="form-label">ሙሉ ስምዎ</label>
            <input type="text" class="form-input" id="fullName" placeholder="እባክዎ ስምዎን ያስገቡ...">
        </div>

        <div class="form-group">
            <label class="form-label">ስልክ ቁጥርዎ</label>
            <input type="tel" class="form-input" id="phoneNum" placeholder="09...">
        </div>

        <div class="form-group">
            <label class="form-label">የባንክ/ቴሌብር የግብይት ቁጥር (Transaction ID / Ref No)</label>
            <input type="text" class="form-input" id="transId" placeholder="ለምሳሌ: FT2345XYZ...">
        </div>

        <button class="btn-submit" onclick="submitOrder()">ክፍያ አረጋግጥ (Submit)</button>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('የሂሳብ ቁጥሩ ተቀድቷል (Copied): ' + text);
        }

        function submitOrder() {
            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phoneNum').value;
            const trans = document.getElementById('transId').value;

            if (!name || !phone || !trans) {
                alert('እባክዎ ሁሉንም መረጃዎች በትክክል ይሙሉ!');
                return;
            }

            alert('እንኳን ደስ አለዎት! ትዕዛዝዎ በትክክል ተመዝግቧል። አስተዳዳሪው አረጋግጦ ቲኬቱን ይልክልዎታል።');
        }
    </script>

</body>
</html>
