<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዘመን ዕጣ - Digital Raffle</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #f0b90b;
        }
        .hero {
            padding: 20px;
            text-align: center;
        }
        .hero h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .hero p {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.5;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin: 15px;
            padding: 15px;
            text-align: left;
        }
        .card h3 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .prize-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            color: #c9d1d9;
            font-size: 14px;
        }
        .prize-list li {
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
        }
        .price-tag {
            text-align: center;
            color: #f0b90b;
            font-weight: bold;
            font-size: 18px;
            margin: 15px 0;
        }
        .btn-pick {
            background-color: #f0b90b;
            color: #000000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="logo">🎟️ ዘመን ዕጣ</div>
        <div>አማርኛ ∨</div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>ዕድልዎ የሚጠበቅበት አጓጊ የዕጣ መድረክ</h1>
        <p>ቁጥርዎን ይምረጡ፣ በቴሌብር ወይም በባንክ ይክፈሉ፣ እና ዕጣውን በቀጥታ ይከታተሉ።</p>
    </div>

    <!-- Raffle Item Card -->
    <div class="card">
        <h3>ዘመን ልዩ ዕጣ</h3>
        <ul class="prize-list">
            <li>🥇 1ኛ ሽልማት: <b>200,000 ETB</b></li>
            <li>🥈 2ኛ ሽልማት: <b>50,000 ETB</b></li>
            <li>🥉 3ኛ ሽልማት: <b>20,000 ETB</b></li>
        </ul>
        <div class="price-tag">300 ETB / ቲኬት</div>
        <p style="color: #8b949e; font-size: 13px; text-align: center;">2 / 2,000 ተሽጧል</p>
        <button class="btn-pick" onclick="alert('ወደ ቁጥር መምረጫ ገጽ ይገባል!')">ቁጥሮችን ይምረጡ</button>
    </div>

</body>
</html>
